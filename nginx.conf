# Nginx configuration for Qatar Visa Bot
# Copy to: /etc/nginx/sites-available/qvc-bot
# Enable with: sudo ln -s /etc/nginx/sites-available/qvc-bot /etc/nginx/sites-enabled/

upstream qvc_backend {
    server 127.0.0.1:8000;
}

server {
    listen 80;
    listen [::]:80;
    server_name _;
    
    # Increase upload limit for Excel files
    client_max_body_size 50M;
    
    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Root location
    location / {
        proxy_pass http://qvc_backend;
        proxy_http_version 1.1;
        
        # Upgrade headers for WebSocket support (if needed)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        
        # Standard headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 86400s;  # 24 hours for long-running tasks
        
        # Buffering
        proxy_buffering on;
        proxy_buffer_size 4k;
        proxy_buffers 8 4k;
        proxy_busy_buffers_size 8k;
    }

    # Caching for static assets
    location ~* ^/static/ {
        proxy_pass http://qvc_backend;
        proxy_cache_valid 200 7d;
        proxy_cache_bypass $http_cache_control;
        add_header Cache-Control "public, max-age=604800";
        expires 7d;
    }

    # Disable caching for API endpoints
    location ~/api/ {
        proxy_pass http://qvc_backend;
        proxy_no_cache 1;
        proxy_cache_bypass 1;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Health check endpoint
    location /health {
        proxy_pass http://qvc_backend;
        access_log off;
    }

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1000;
    gzip_types text/plain text/css text/xml text/javascript applicaion/js application/json application/xml+rss;
}
